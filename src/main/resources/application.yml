# ftx-courts-api. Every value that changes per environment comes from an environment variable.
server:
  port: ${PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: ftx-courts-api
  datasource:
    # courts_app is created by ftx-infra-postgres and receives courts_writer from ftx-courts-db.
    url: ${COURTS_DB_URL:jdbc:postgresql://postgres:5432/ftx}
    username: ${COURTS_DB_USER:courts_app}
    # No default on purpose: without a password the service does not start.
    password: ${COURTS_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${COURTS_DB_POOL_SIZE:5}
  flyway:
    enabled: false                       # the schema belongs to ftx-courts-db; this API never migrates
  jackson:
    deserialization:
      fail-on-unknown-properties: true   # UpdateCourtRequest has additionalProperties: false
  mvc:
    problemdetails:
      enabled: false                     # errors use ErrorResponse of _shared.yaml

management:
  endpoints:
    web:
      base-path: /                       # GET /health, /health/liveness, /health/readiness
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: ecs                       # JSON lines with correlationId (13-operations/observability.md)
